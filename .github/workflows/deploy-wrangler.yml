name: Deploy to Cloudflare Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: write
    env:
      HUSKY: 0
      TZ: Asia/Shanghai
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # package.json is the single pnpm version source. Do not repeat it here.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build static site
        run: pnpm build

      # Required repository secrets:
      # - CLOUDFLARE_API_TOKEN with Cloudflare Pages edit access
      # - CLOUDFLARE_ACCOUNT_ID
      - name: Deploy with Wrangler
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GH_TOKEN }}
          wranglerVersion: "4"
          command: pages deploy dist --project-name=one-transfer --branch=main --commit-hash=${{ github.sha }}
